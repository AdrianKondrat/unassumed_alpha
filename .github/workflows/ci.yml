name: CI

on:
  push:
    branches: [master, mvp]
  pull_request:
    branches: [main, master, mvp]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run test:ai
      - run: npm run test:auth
      - run: npm run test:canvas
      - run: npm run test:assumptions
      - run: npm run test:rehearsal
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
      - name: Database assertions (RLS, constraints, triggers)
        run: |
          for f in supabase/tests/*.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          # The AI provider is a local fake (scripts/fake-openrouter.mjs): deterministic, free, and it records
          # whether every request carried the zero-data-retention flag.
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nOPENROUTER_API_KEY=ci-fake-key\nOPENROUTER_BASE_URL=http://127.0.0.1:4010/v1\n' "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          source supabase.env
          node scripts/fake-openrouter.mjs &
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4010/__calls && break; sleep 1; done
          # SUPABASE_URL / SUPABASE_ANON_KEY let the smoke test prove, through the real PostgREST with the
          # founder's own token, that the hidden rehearsal persona cannot be read or written by a client.
          BASE_URL=http://localhost:4321 MAIL_URL=http://127.0.0.1:54324 FAKE_AI_URL=http://127.0.0.1:4010 SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run smoke
      - if: always()
        run: supabase stop --no-backup

  # Deploys the MVP Worker (`unassumed-mvp`) after lint/typecheck/build/smoke pass. Only pushes to `mvp`
  # deploy; the main-branch marketing site (FR-018) is a separate Worker and is never touched here.
  deploy:
    needs: [ci, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/mvp'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-mvp
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_KEY SUPABASE_SERVICE_ROLE_KEY OPENROUTER_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repository secrets:$missing (see README, section 'MVP deploy')"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep the hosted database schema in step with the code. Opt-in: runs only when all three secrets exist.
      - name: Apply database migrations to the hosted Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD not all set; skipping 'supabase db push'. Run migrations manually."
            exit 0
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --password "$SUPABASE_DB_PASSWORD"
      - run: npm run build
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            OPENROUTER_API_KEY
      - name: Post-deploy check (HTTP 200)
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::wrangler-action did not report a deployment URL"
            exit 1
          fi
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            --output /dev/null --write-out "GET $DEPLOYMENT_URL -> %{http_code}\n" "$DEPLOYMENT_URL"
